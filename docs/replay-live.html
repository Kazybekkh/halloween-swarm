  if (pi === 6 && t.escalations.length && t.escalations[0].ok === false && t.escalations[0].status === "rejected")
    text("DISCORD 401", 76, 196, C.evacuate);

  // sector rooms
  t.sectors.forEach(s => {
    const R = L.rooms[s.name], rd = s.reading || {}, sen = rd.sensors || {}, sg = rd.sighting, act = finalAction(s);
    const shown = pi >= 4 ? act : pi >= 3 && s.decision ? s.decision.action : (pi >= 1 && s.triaged && p > 0.7) || (pi > 1 && s.triaged) ? "observe" : null;
    tiles(R.x, R.y, R.w, R.h, C.floorA, C.floorB);
    if (shown) { g.globalAlpha = 0.18; rect(R.x, R.y, R.w, R.h, ACT[shown]); g.globalAlpha = 1; }
    const breached = (rd.containment_state || "") === "breached";
    walls(R.x, R.y, R.w, R.h, breached && Math.floor(anim * 3) % 2 ? C.evacuate : shown ? ACT[shown] : C.wall, R.door);
    text(human(s.name).toUpperCase(), R.x + 5, R.y + 5, C.text);
    // EMF gauge and temperature
    const emf = sen.emf_milligauss ?? 0, bar = clamp(Math.log10(1 + emf) / Math.log10(200), 0, 1);
    rect(R.x + 5, R.y + 16, 40, 4, C.dark); rect(R.x + 5, R.y + 16, 40 * bar, 4, emf >= 30 ? C.evacuate : C.observe);
    text(`EMF ${emf}`, R.x + 48, R.y + 14, C.muted);
    text(`${sen.temp_c ?? "?"}°C`, R.x + 5, R.y + 23, (sen.temp_c ?? 20) <= 5 ? C.cold : C.muted);
    if (rd.containment_state) text(rd.containment_state.toUpperCase(), R.x + R.w - 5, R.y + 5, breached ? C.evacuate : C.muted, 8, "right");
    // frost when cold
    if ((sen.temp_c ?? 20) <= 5) { g.globalAlpha = 0.12; rect(R.x + 2, R.y + 2, R.w - 4, R.h - 4, C.cold); g.globalAlpha = 1; }
    // occupants
    const rand = rng(s.name), midY = R.y + R.h * 0.62;
    const pinned = /(\d+)\s*pinned/i.exec(rd.civilian_status || ""), nPinned = pinned ? +pinned[1] : 0;
    const evacuating = act === "evacuate" && pi >= 5, ep = pi === 5 ? p * 0.5 : pi === 6 ? 0.5 + p * 0.5 : 0;
    for (let k = 0; k < nPinned; k++) {
      const home = [R.x + 12 + (k % 2) * 8, midY - 6 + Math.floor(k / 2) * 12];
      if (evacuating) { const pos = walk([home, [R.door[0], R.door[1] + (R.door[1] > R.y + 2 ? 4 : -4)], [R.door[0], R.cy + 4], [L.exit[0] - 4, R.cy + 4]], clamp(ep * 1.3 - k * 0.08, 0, 1));
        if (pos[0] < L.exit[0] - 6) person(pos[0], pos[1], "#c9c3d9", { walking: true }); }
      else person(home[0], home[1], "#c9c3d9", { shake: true });
    }
    if (sg && BENIGN.test(sg.entity_class)) for (let k = 0; k < 6; k++) {
      const bx = R.x + 20 + rand() * (R.w - 40), by = R.y + 36 + rand() * (R.h - 48), wob = Math.sin(anim * 1.5 + k) * 3;
      person(bx + wob, by, ["#7fa4c9", "#c98fa0", "#9fc98f", "#c9b88f"][k % 4], { walking: true });
    }
    if (sg && !BENIGN.test(sg.entity_class)) {
      const gx = R.x + R.w * 0.68, gy = midY + 4, contained = act === "contain" && pi >= 5;
      ghost(gx, gy, sg.confidence > 0.6 ? 2 : 1, sg.confidence > 0.6 ? C.ghost : "#9fb3d9", clamp(sg.confidence + 0.2, 0.3, 1));
      text(`${sg.entity_class} ${sg.confidence}`.toUpperCase(), R.x + R.w - 5, R.y + R.h - 12, C.muted, 8, "right");
      if (contained) { g.strokeStyle = C.contain; g.lineWidth = 2; g.globalAlpha = 0.7 + 0.3 * Math.sin(anim * 5); g.beginPath(); g.arc(gx, gy - 12, 22, 0, Math.PI * 2); g.stroke(); g.globalAlpha = 1; }
    }
    // triage readout
    if (pi >= 1 && s.p != null && (pi > 1 || p > 0.25)) bubble(R.x + R.w / 2, R.y + R.h - 28, `P=${fmt(s.p)} · ${s.rule ? s.rule.signals.length : "?"} SIGNALS`, s.p >= 0.5 ? C.evacuate : C.observe, C.eye);
    if (pi === 1 && p > 0.25) { g.strokeStyle = C.eye; g.globalAlpha = 0.35; g.lineWidth = 1; g.beginPath(); g.moveTo(ex + 16, ey); g.lineTo(R.x + R.w / 2, R.y + R.h / 2); g.stroke(); g.globalAlpha = 1; }
    if (s.triaged && (pi > 1 || (pi === 1 && p > 0.7))) stamp(R.x + R.w / 2, R.y + R.h / 2 - 6, "CLEAR", C.observe, pi === 1 ? (p - 0.7) / 0.3 : 1);
    // gate verdict
    if (s.gate && pi >= 4) { const ok = s.gate.final === s.gate.proposed; stamp(R.x + R.w / 2, R.y + R.h / 2 - 6, ok ? s.gate.final.toUpperCase() : "VETO", ok ? ACT[s.gate.final] : C.gold, pi === 4 ? p : 1); }
  });

  // scouts walk from HQ to their rooms and report
  crew.forEach((s, k) => {
    const R = L.rooms[s.name]; if (!R || pi < 2) return;
    const into = R.door[1] > R.y + 2 ? -14 : 14;
    const path = [[118, 60 + k * 4], [128, 60 + k * 4], [128, R.cy], [R.door[0], R.cy], [R.door[0], R.door[1] + into], [R.x + R.w * 0.42, R.y + R.h * 0.62]];
    const wp = pi === 2 ? clamp(p / 0.6, 0, 1) : 1, pos = walk(path, wp);
    person(pos[0], pos[1], C.accent, { walking: wp < 1, antenna: C.observe });
    if (s.scout && pi <= 3 && (pi > 2 || p > 0.62)) bubble(pos[0], pos[1] - 30, `THREAT ${s.scout.threat_level}/10 → ${s.scout.recommended_action.toUpperCase()}`, ACT[s.scout.recommended_action]);
  });
  if (pi === 2 && crew.length) bubble(60, 98, t.grounding_reused ? "FACTS REUSED" : `${t.searches} SEARCHES`, C.blue, C.blue);
  if (pi === 3 && crew.length) { const d = crew.map(s => s.decision).filter(Boolean)[0]; if (d) bubble(60, 44, `${d.action.toUpperCase()} · CONF ${fmt(d.confidence)}`, ACT[d.action], C.gold); }
  if (pi === 5) { const j = t.submission && t.submission.judgment, a = p < 0.15 ? p / 0.15 : p > 0.85 ? (1 - p) / 0.15 : 1;
    const msg = j ? (j.verdict === "correct" ? `+${j.score} CORRECT · EXPECTED ${j.expected.toUpperCase()}` : `${j.verdict.toUpperCase()} · SCORE ${j.score}`) : `DRY RUN · ${String(t.tick_action).toUpperCase()} NOT SUBMITTED`;
    g.globalAlpha = a; rect(140, 92, 332, 26, C.box); rect(140, 92, 332, 1, j && j.verdict === "correct" ? C.observe : C.muted);
    text(msg, 306, 101, j ? (j.verdict === "correct" ? C.observe : C.evacuate) : C.muted, 8, "center"); g.globalAlpha = 1; }
  if (pi === 0) { const a = p < 0.15 ? p / 0.15 : p > 0.85 ? (1 - p) / 0.15 : 1; g.globalAlpha = a; rect(140, 92, 332, 26, C.box); text(`TICK ${t.tick_id} INCOMING`, 306, 101, C.gold, 8, "center"); g.globalAlpha = 1; }

  dialog(t, pi, p, crew);
}

function lineFor(t, pi, crew) {
  const first = crew.find(s => s.scout) || {}, d = (crew.find(s => s.decision) || {}).decision;
  switch (pi) {
    case 0: return ["FEED", `Tick ${t.tick_id}: ${t.sectors.length} sector${t.sectors.length > 1 ? "s" : ""} report in. Agent budget ${t.max_agents ?? "?"}. Each reading goes into its own scout's memory.`];
    case 1: return ["ORACLE · OPENAI DECISIONS", `Scored every sector in ${t.triage_ms ?? "?"} ms. ` + t.sectors.map(s => `${human(s.name)} p=${fmt(s.p)}${s.triaged ? " clear" : " → crew"}`).join(", ") + "."];
    case 2: return crew.length ? [`SCOUT · ${human(first.name || "").toUpperCase()}`, first.scout ? `Threat ${first.scout.threat_level}/10, ${first.scout.civilians_at_risk} at risk. ${first.scout.reasoning}` : "No scout report."]
                               : ["SWARM", "Every sector cleared by triage. No Parasail call needed."];
    case 3: return crew.length && d ? ["COMMANDER · PARASAIL", `${d.action.toUpperCase()} at confidence ${fmt(d.confidence)}. ${d.rationale}`] : ["COMMANDER", "Nothing to command this tick."];
    case 4: { const gs = t.sectors.filter(s => s.gate); return ["GATE · RULE + DECISIONS", gs.length ? gs.map(s => `${human(s.name)}: ${s.gate.proposed} → ${s.gate.final} (${s.gate.why})`).join(" ") : "Nothing proposed beyond observe. Nothing to veto."]; }
    case 5: { const j = t.submission && t.submission.judgment; return ["SCENARIO FEED", j ? `Submitted ${t.tick_action}. Expected ${j.expected}: ${j.verdict}, score ${j.score}, false alarm ${j.false_alarm}. ${j.rationale}` : `Dry run: ${t.tick_action} not submitted.`]; }
    case 6: { if (!t.escalations.length) return ["RADIO", "No contain or evacuate. Nothing posted."];
      const e = t.escalations[0];
      return ["RADIO · ONE → #LOFT-INCIDENT", `${e.label || String(e.status).toUpperCase()} Message: ${e.message}`]; }
  }
}
function dialog(t, pi, p, crew) {
  const [who, msg] = lineFor(t, pi, crew), x = 8, y = 220, w = W - 16, h = 74;
  rect(x, y, w, h, C.box); rect(x, y, w, 2, C.accent); rect(x, y + h - 2, w, 2, C.accent); rect(x, y, 2, h, C.accent); rect(x + w - 2, y, 2, h, C.accent);
  g.font = "8px Silkscreen, monospace"; const tw = g.measureText(who).width + 10;
  rect(x + 8, y - 6, tw, 12, C.accent); text(who, x + 13, y - 4, C.dark);
  const shown = msg.slice(0, Math.ceil(msg.length * clamp(p / 0.55, 0, 1)));
  wrap(shown, w - 20).slice(0, 5).forEach((ln, i) => text(ln, x + 10, y + 12 + i * 11, C.text));
  if (p >= 0.55 && Math.floor(performance.now() / 400) % 2) text("▼", x + w - 14, y + h - 12, C.accent);
  const cap = $("caption"), html = `<b>${who}</b><br>${msg.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]))}`;
  if (cap.dataset.k !== who + msg) { cap.innerHTML = html; cap.dataset.k = who + msg; }
}

// ---------- controls ----------
$("note").textContent = `${RUN.mode === "live" ? "Live run" : "Fixture dry run"} of ${RUN.team || "the swarm"} · ${RUN.ticks.length} ticks · every number comes from ${RUN.log}`;
RUN.ticks.forEach((t, i) => { const o = document.createElement("option"); o.value = i; o.textContent = `TICK ${t.tick_id}`; $("tick").appendChild(o); });
function setPlay(on) { playing = on; $("play").textContent = on ? "❚❚ PAUSE" : "▶ PLAY"; }
function jumpPhase(dir) { const i = segs.indexOf(segAt(now)); const s = segs[clamp(i + dir, 0, segs.length - 1)]; now = s.start + (dir === 0 ? 0 : 0.001); }
$("play").onclick = () => { if (now >= T - 0.05) now = 0; setPlay(!playing); };
$("prev").onclick = () => { const s = segAt(now); now = now - s.start > 0.6 ? s.start : (segs[segs.indexOf(s) - 1] || s).start; };
$("next").onclick = () => jumpPhase(1);
$("tick").onchange = e => { now = segs.find(s => s.ti === +e.target.value).start; };
$("speed").onchange = e => { speed = +e.target.value; };
$("scrub").oninput = e => { now = (+e.target.value / 1000) * T; setPlay(false); };
document.addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT") return;
  if (e.key === " ") { e.preventDefault(); $("play").click(); }
  if (e.key === "ArrowRight") $("next").click();
  if (e.key === "ArrowLeft") $("prev").click();
});
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
function frame(ts) {
  const dt = last ? Math.min(0.1, (ts - last) / 1000) : 0; last = ts;
  if (playing) { now += dt * speed; if (now >= T) { now = T - 0.001; setPlay(false); } }
  $("scrub").value = Math.round((now / T) * 1000); $("tick").value = segAt(now).ti;
  draw(); requestAnimationFrame(frame);
}
// open on the first breach tick's swarm phase so the still frame already shows the game
const firstBreach = segs.find(s => s.pi === 2 && RUN.ticks[s.ti].sectors.some(x => !x.triaged));
now = firstBreach ? firstBreach.start + firstBreach.dur * 0.8 : 0;
(document.fonts && document.fonts.load ? document.fonts.load("8px Silkscreen").catch(() => {}) : Promise.resolve()).finally(() => { if (!still) setPlay(false); requestAnimationFrame(frame); });
</script>
